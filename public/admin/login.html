<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · JACHA TOURS</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">JACHA TOURS</div>
    <div class="login-sub">Panel de Administración</div>

    <div class="error-msg" id="err" role="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <input type="text" id="username" class="form-input" placeholder="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn" class="btn btn-gold btn-full" style="margin-top:8px;">Entrar →</button>
    </form>

    <p style="margin-top:26px;text-align:center;font-size:.78rem;color:var(--text-dim);">
      ¿Eres cliente? <a href="../login.html" style="color:var(--gold);">Ingresa aquí</a>
    </p>
  </div>
</div>

<script src="_shared.js"></script>
<script>
  // Si ya hay una sesión válida, entra directo
  if (getToken()) {
    api('/auth/me', { noRedirect: true }).then(() => location.href = 'dashboard.html').catch(() => clearToken());
  }

  const err = document.getElementById('err');
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    const btn = document.getElementById('btn'); btn.disabled = true;
    try {
      const data = await api('/auth/login', {
        method: 'POST', noRedirect: true,
        body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value }),
      });
      setToken(data.token);
      location.href = 'dashboard.html';
    } catch (e) {
      err.textContent = e.message || 'Usuario o contraseña incorrectos';
      err.classList.add('show');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
